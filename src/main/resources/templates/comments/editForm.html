<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>댓글 수정</title>
</head>
<body>
    <h1>댓글 수정</h1>
    <form action="/comments/{commentId}/edit" method="post">
        <textarea name="content" rows="4" cols="50">${comment.content}</textarea><br>
        <input type="submit" value="수정 완료">
    </form>

    <!-- 삭제 버튼 추가 -->
    <form action="/comments/{commentId}/delete" method="post" style="margin-top:10px;">
        <button type="submit" onclick="return confirm('정말 삭제할까요?')">댓글 삭제</button>
    </form>

    <a href="/posts/${comment.postId}">뒤로 가기</a>
</body>
</html>
