<meta charset="UTF-8">
<title>공부하기</title>
<!-- 필요하다면 Bootstrap CSS 링크 추가 -->
<!-- <link href="path/to/bootstrap.min.css" rel="stylesheet"> -->
<style>
  /* 필요한 경우, 추가 커스텀 스타일 */
  .card {
    /* 기존 카드에 적용된 그림자, 배경색 등이 있다면 그대로 사용 */
    /* 예) box-shadow: 0 2px 8px rgba(0,0,0,0.1); */
    margin: 20px auto;
    max-width: 800px; /* 화면에서 카드가 너무 넓어지지 않도록 제한 */
  }

  .card-body {
    /* 카드 안쪽 패딩 등은 기존 코드에 맞추어 사용 */
    /* 예) padding: 20px; */
  }

  .kanji-box {
    border-radius: 8px;
    min-width: 350px;  /* 고정 너비 대신 최소 너비 설정 */
    min-height: 200px; /* 고정 높이 대신 최소 높이 설정 */
    padding: 40px;     /* 내부 여백으로 공간 확보 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0 auto;
  }
  /* md 이상일 때: 오른쪽 칼럼이 가로로 붙어 있을 때 */
  @media (min-width: 768px) {
    .button-group {
      flex-wrap: wrap;
      justify-content: center;
      max-width: 250px;
    }
    .button-group button {
      flex: 0 0 48%;
    }
  }
  /* md 미만일 때: 오른쪽 칼럼이 아래로 내려갈 때 한 줄로 배치 */
  @media (max-width: 767.98px) {
    .button-group {
      flex-wrap: nowrap;
    }
  }

  .kanji-box .small-text {
    font-size: 1.4rem;
  }

  .kanji-box .large-text {
    font-size: 5rem;     /* 글자 크기 더 키움 */
    font-weight: bold;
    margin: 25px 0;      /* 상하 여백 더 늘림 */
    line-height: 1.2;    /* 줄 간격 조정 */
  }

  .hidden-text {
    color: transparent;
    user-select: none;
  }
  
  .kanji-box .placeholder {
    height: 1.2rem;
    margin: 4px 0;
  }
</style>

<main id="main" class="main">

  <section class="section">
    <!-- 카드 영역 -->
<!--    <div class="container my-5">-->
    <form class="card" >
      <div class="card-body">
        <!-- 상단 제목(예: Frame 1)과 우측 '레벨 선택' -->
        <div class="d-flex justify-content-end align-items-center mt-3">
           <button type="button" class="btn btn-secondary" onclick="stopStudy()">공부 그만하기</button>

        </div>

        <hr />

        <!-- 중앙 컨텐츠 영역 -->
        <div class="row">
          <!-- 왼쪽: 한자 박스 -->
          <div class="kanji-box">
          <div class="small-text placeholder" id="hiragana" > </div>
          <div class="large-text" id="kanji"> </div>
          <div class="small-text placeholder" id="meaning"> </div>
        </div>

          <div class="d-flex flex-column align-items-center">
            <!--                 맞힌 개수/ 공부할 개수-->
            <p class="mt-4" id="progress"> 0 / 0</p> <!-- 초기값은 스크립트에서 바로 렌더링 -->



            <div id="controlButtons" class="d-flex flex-wrap justify-content-center gap-2 button-group">
              <button type="button" class="btn btn-primary" onclick="toggleMeaning()">뜻</button>
              <button type="button" class="btn btn-primary" onclick="toggleHiragana()">히라가나</button>
              <button type="button" class="btn btn-success" onclick="know()">안다</button>
              <button type="button" class="btn btn-danger" onclick="dontKnow()">모른다</button>
              <button type="button" class="btn btn-success" onclick="completelyKnow()">완전히 안다</button>
            </div>
          </div>
          </div>
          </div><!-- /.row -->
        </div><!-- /.card-body -->
      </form><!-- /.card -->

      <div id="restartButton" style="display: none; text-align: center; margin-top: 1rem;">
        <button class="btn btn-primary" onclick="window.location.reload()">다시 학습하기</button>
        <button class="btn btn-secondary" onclick="window.location.href='/studies/levelChoice'">챕터 선택으로 돌아가기</button>
      </div>
</section><!-- /.section -->
  <script th:inline="javascript">

    let words = /*[[${words}]]*/ [];
    let chapterId =/*[[${chapterId}]]*/[];
    let index = 0;
    let cumulativeWords = /*[[${cumulativeWords}]]*/ 0;  // 전체 누적 단어 수
    let knownWordsCount = /*[[${knownWordsCount} ?: 0]]*/ 0;  // 안다 개수 초기값
    // let knownWordsCount = /*[[${knownWordsCount} ?: 0]]*/[]; // 안다로 체크한 단어 수

    window.onload = () => {
      console.log("안다onload",knownWordsCount);
      console.log("인덱스onload",index);

      updateProgress();// 초기값 세팅
      if (words.length > 0) {
        console.log("안다updateProgress",knownWordsCount);
        console.log("인덱스updateProgress",index);
        showWord();
      } else {
        alert("복습할 단어가 없습니다!");
        window.location.href = "/studies/levelChoice";
      }
    };

    function showWord() {
      console.log("안다showWord",knownWordsCount);
      console.log("인덱스showWord",index);
      if (index >= words.length) {
        console.log("안다showWord_if",knownWordsCount);
        console.log("인덱스showWord_if",index);
        // 모든 단어를 다 봤을 때
        if (words.length === 0) {
          console.log("안다showWord_ifif",knownWordsCount);
          console.log("인덱스showWord_ifif",index);
          // 더 이상 복습할 단어가 없는 경우
          alert("모든 복습이 완료되었습니다!");
          window.location.href = "/studies/levelChoice";
          return;
        }
        // 인덱스 초기화 및 다시 시작
        index = 0;
      }
      
      // 모든 단어를 알게 되었을 때
      if (knownWordsCount >= cumulativeWords) {
        document.querySelector('.card').style.display = 'none';
        console.log("restartButton")
        document.getElementById('restartButton').style.display = 'block';
        alert("모든 단어를 알게 되었습니다! 복습을 완료했습니다.");
        return;
      }
      
      const word = words[index];
      document.getElementById('kanji').innerText = word.kanji;
      document.getElementById('hiragana').innerText = "";
      document.getElementById('hiragana').classList.add('placeholder');
      document.getElementById('meaning').innerText = "";
      document.getElementById('meaning').classList.add('placeholder');
    }

    function toggleHiragana() {
      const elem = document.getElementById('hiragana');
      if (elem.innerText === "") {
        elem.innerText = words[index].hiragana;
        elem.classList.remove('placeholder');
      } else {
        elem.innerText = "";
        elem.classList.add('placeholder');
      }
    }

    function toggleMeaning() {
      const elem = document.getElementById('meaning');
      if (elem.innerText === "") {
        elem.innerText = words[index].meaning;
        elem.classList.remove('placeholder');
      } else {
        elem.innerText = "";
        elem.classList.add('placeholder');
      }
    }

    function know() {
      console.log("안다know",knownWordsCount);
      console.log("인덱스know",index);
      // 안다 버튼은 프론트에서만 카운트를 +1하고 백엔드에 요청하지 않음
      knownWordsCount++;
      if (knownWordsCount > cumulativeWords) knownWordsCount = cumulativeWords;
      updateProgress();
      
      // 모든 단어를 다 알게 되면
      if (knownWordsCount >= cumulativeWords) {
        alert("모든 복습이 완료되었습니다!");
        window.location.href = "/studies/levelChoice";
        return;
      }
      
      // 다음 단어로 이동
      index++;
      showWord();
    }
    
    function completelyKnow() {
      // 완전히 안다 버튼은 해당 단어를 review_queue에서 삭제
      const wordId = words[index].wordId;
      
      fetch(`/studies/reviewUpdate`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          wordId: wordId
        })
      }).then(() => {
        // 현재 배열에서 해당 단어 제거
        words.splice(index, 1);
        
        // 전체 단어 수만 업데이트하고 안다 카운트는 그대로 유지
        cumulativeWords = words.length;
        
        updateProgress();
        
        // 단어가 없으면 완료 메시지 표시(이거 마지막 안다고 한게 적용되기 전에 // 모든 단어를 다 알게 되면 이게 작동되서 안됨)
        if (words.length === 0) {
          document.getElementById('controlButtons').style.display = 'none';
          document.getElementById('restartButton').style.display = 'block';
          alert("모든 단어를 완료했습니다!");
          return;
        }
        
        // 배열에서 단어가 제거되었으므로 인덱스를 증가시키지 않음
        // 현재 위치에 새 단어가 옮겨왔기 때문
        showWord();
      });
    }
    
    function dontKnow() {
      console.log("안다dontKnow",knownWordsCount);
      console.log("인덱스dontKnow",index);
      // 모든 단어를 다 알게 되면
      if (knownWordsCount >= cumulativeWords) {
        alert("모든 복습이 완료되었습니다!");
        window.location.href = "/studies/levelChoice";
        return;
      }
      // 모른다 버튼은 다음 단어로만 넘어감
      index++;
      showWord();
    }

    function stopStudy() {
      alert("그만하기를 눌렀습니다! /n ⚠️안다고 한 단어는 따로 저장되지 않습니다!! 다시 복습하기를 하실 때는 이번에 안다, 모른다 를 누른 모든 단어를 공부합니다.⚠️");
      window.location.href = "/studies/levelChoice";
    }

    function updateProgress() {
      document.getElementById('progress').innerText = `${knownWordsCount} / ${cumulativeWords}`;
    }
  </script>
