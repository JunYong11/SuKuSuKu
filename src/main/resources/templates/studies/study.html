<meta charset="UTF-8">
<title>공부하기</title>
<!-- 필요하다면 Bootstrap CSS 링크 추가 -->
<!-- <link href="path/to/bootstrap.min.css" rel="stylesheet"> -->
<style>
  /* 필요한 경우, 추가 커스텀 스타일 */
  .card {
    /* 기존 카드에 적용된 그림자, 배경색 등이 있다면 그대로 사용 */
    /* 예) box-shadow: 0 2px 8px rgba(0,0,0,0.1); */
    margin: 20px auto;
    max-width: 800px; /* 화면에서 카드가 너무 넓어지지 않도록 제한 */
  }

  .card-body {
    /* 카드 안쪽 패딩 등은 기존 코드에 맞추어 사용 */
    /* 예) padding: 20px; */
  }

  .kanji-box {

    border-radius: 8px;
    width: 200px;
    height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0 auto;
  }
  /* md 이상일 때: 오른쪽 칼럼이 가로로 붙어 있을 때 */
  @media (min-width: 768px) {
    .button-group {
      flex-wrap: wrap;
      justify-content: center;
      max-width: 250px;
    }
    .button-group button {
      flex: 0 0 48%;
    }
  }
  /* md 미만일 때: 오른쪽 칼럼이 아래로 내려갈 때 한 줄로 배치 */
  @media (max-width: 767.98px) {
    .button-group {
      flex-wrap: nowrap;
    }
  }

  .kanji-box .small-text {
    font-size: 1.2rem;
  }

  .kanji-box .large-text {
    font-size: 2rem;
    font-weight: bold;
    margin: 8px 0;
  }
</style>

<main id="main" class="main">

  <div class="pagetitle">
    <h1>공부하기</h1>
    <nav>
      <!-- <nav class="d-flex justify-content-end"> -->
      <!-- <nav class="d-flex justify-content-center"> -->
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">레벨 선택</li>
        <li class="breadcrumb-item ">즐겨찾기</li>
      </ol>
    </nav>
  </div><!-- End Page Title -->

  <section class="section">
    <!-- 카드 영역 -->
<!--    <div class="container my-5">-->
    <form class="card">
      <div class="card-body">
        <!-- 상단 제목(예: Frame 1)과 우측 '레벨 선택' -->
        <div class="d-flex justify-content-end align-items-center mt-3">
           <button class="btn btn-secondary" onclick="stopStudy()">공부 그만하기</button>
        </div>

        <hr />

        <!-- 중앙 컨텐츠 영역 -->
        <div class="row">
          <!-- 왼쪽: 한자 박스 -->
          <div class="kanji-box">
          <div class="small-text" id="hiragana">히라가나 보기</div>
          <div class="large-text" id="kanji">漢字</div>
          <div class="small-text" id="meaning">뜻 보기</div>
        </div>

          <div class="d-flex flex-column align-items-center">
            <!--                 맞힌 개수/ 공부할 개수-->
            <p class="mt-4" id="progress">0 / 0</p> <!-- 초기값은 스크립트에서 바로 렌더링 -->




            <div class="d-flex flex-wrap justify-content-center gap-2 button-group">
              <button type="button" class="btn btn-primary" onclick="toggleMeaning()">뜻</button>
              <button type="button" class="btn btn-primary" onclick="toggleHiragana()">히라가나</button>
              <button type="button" class="btn btn-success" onclick="know()">안다</button>
              <button type="button" class="btn btn-danger" onclick="dontKnow()">모른다</button>
            </div>
          </div>
          </div>
          </div><!-- /.row -->
        </div><!-- /.card-body -->
      </form><!-- /.card -->
</section><!-- /.section -->
  <script th:inline="javascript">
    let words = /*[[${words}]]*/ [];
    let chapterId =/*[[${chapterId}]]*/[];
    let index = 0;

    let totalWordsCount = words.length;
    let knownWordsCount = /*[[${knownWordsCount} ?: 0]]*/[]; // 안다로 체크한 단어 수

    window.onload = () => {
      updateProgress();  // 초기값 세팅
      showWord();        // 첫 단어 보여주기
    };

    function showWord() {
      if (index >= words.length) {
        reloadWords();  // 다시 모른다 리스트 가져오기
        return;
      }

      const word = words[index];
      document.getElementById('kanji').innerText = word.kanji;
      document.getElementById('hiragana').innerText = "히라가나 보기";
      document.getElementById('meaning').innerText = "뜻 보기";
    }

    function toggleHiragana() {
      const elem = document.getElementById('hiragana');
      elem.innerText = (elem.innerText === "히라가나 보기") ? words[index].hiragana : "히라가나 보기";
    }

    function toggleMeaning() {
      const elem = document.getElementById('meaning');
      elem.innerText = (elem.innerText === "뜻 보기") ? words[index].meaning : "뜻 보기";
    }

    function know() {
      knownWordsCount++;
      updateProgressRequest("안다");
    }

    function dontKnow() {
      updateProgressRequest("모른다");
    }

    function updateProgressRequest(status) {
      fetch('/studies/wordProgress', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          wordId: words[index].wordId,
          status: status,
          chapterId: chapterId
        })
      }).then(() => {
        index++;
        updateProgress();
        showWord();
      });
    }

    function reloadWords() {
      fetch(`/studies/remainingWords?chapterId=${chapterId}`)
              .then(response => response.json())
              .then(data => {
                words = data;
                index = 0;
                totalWordsCount = words.length;  // 업데이트 필요할 경우 (전체 단어 수가 바뀌는 경우)
                updateProgress();

                if (words.length === 0) {
                  alert("이 챕터를 모두 학습했습니다!");
                  window.location.href = "/studies/levelChoice";
                } else {
                  showWord();
                }
              });
    }

    function stopStudy() {
      alert("그만하기를 눌렀습니다!");
      window.location.href = "/studies/levelChoice";
    }

    function updateProgress() {
      document.getElementById('progress').innerText = `${knownWordsCount} / ${totalWordsCount}`;
    }
  </script>
