<meta charset="UTF-8">
<title>공부하기</title>
<!-- 필요하다면 Bootstrap CSS 링크 추가 -->
<!-- <link href="path/to/bootstrap.min.css" rel="stylesheet"> -->
<style>
  /* 필요한 경우, 추가 커스텀 스타일 */
  .card {
    /* 기존 카드에 적용된 그림자, 배경색 등이 있다면 그대로 사용 */
    /* 예) box-shadow: 0 2px 8px rgba(0,0,0,0.1); */
    margin: 20px auto;
    max-width: 800px; /* 화면에서 카드가 너무 넓어지지 않도록 제한 */
  }

  .card-body {
    /* 카드 안쪽 패딩 등은 기존 코드에 맞추어 사용 */
    /* 예) padding: 20px; */
  }

  .kanji-box {
    border-radius: 8px;
    min-width: 350px;  /* 고정 너비 대신 최소 너비 설정 */
    min-height: 200px; /* 고정 높이 대신 최소 높이 설정 */
    padding: 40px;     /* 내부 여백으로 공간 확보 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0 auto;
  }
  /* md 이상일 때: 오른쪽 칼럼이 가로로 붙어 있을 때 */
  @media (min-width: 768px) {
    .button-group {
      flex-wrap: wrap;
      justify-content: center;
      max-width: 250px;
    }
    .button-group button {
      flex: 0 0 48%;
    }
  }
  /* md 미만일 때: 오른쪽 칼럼이 아래로 내려갈 때 한 줄로 배치 */
  @media (max-width: 767.98px) {
    .button-group {
      flex-wrap: nowrap;
    }
  }

  .kanji-box .small-text {
    font-size: 1.4rem;
  }

  .kanji-box .large-text {
    font-size: 5rem;     /* 글자 크기 더 키움 */
    font-weight: bold;
    margin: 25px 0;      /* 상하 여백 더 늘림 */
    line-height: 1.2;    /* 줄 간격 조정 */
  }

  .hidden-text {
    color: transparent;
    user-select: none;
  }
  
  .kanji-box .placeholder {
    height: 1.2rem;
    margin: 4px 0;
  }
</style>

<main id="main" class="main">

  <section class="section">
    <!-- 카드 영역 -->
<!--    <div class="container my-5">-->
    <form class="card">
      <div class="card-body">
        <!-- 상단 제목(예: Frame 1)과 우측 '레벨 선택' -->
        <div class="d-flex justify-content-end align-items-center mt-3">
           <button type="button" class="btn btn-secondary" onclick="stopStudy()">공부 그만하기</button>
        </div>

        <hr />

        <!-- 중앙 컨텐츠 영역 -->
        <div class="row">
          <!-- 왼쪽: 한자 박스 -->
          <div class="kanji-box">
          <div class="small-text placeholder" id="hiragana"></div>
          <div class="large-text" id="kanji">漢字</div>
          <div class="small-text placeholder" id="meaning"></div>
        </div>

          <div class="d-flex flex-column align-items-center">
            <!--                 맞힌 개수/ 공부할 개수-->
            <p class="mt-4" id="progress">0 / 0</p> <!-- 초기값은 스크립트에서 바로 렌더링 -->




            <div class="d-flex flex-wrap justify-content-center gap-2 button-group">
              <button type="button" class="btn btn-primary" onclick="toggleMeaning()">뜻</button>
              <button type="button" class="btn btn-primary" onclick="toggleHiragana()">히라가나</button>
              <button type="button" class="btn btn-success" onclick="know()">안다</button>
              <button type="button" class="btn btn-danger" onclick="dontKnow()">모른다</button>
            </div>
          </div>
          </div>
          </div><!-- /.row -->
        </div><!-- /.card-body -->
      </form><!-- /.card -->
</section><!-- /.section -->
  <script th:inline="javascript">

    let words = /*[[${words}]]*/ [];
    let chapterId =/*[[${chapterId}]]*/[];
    let index = 0;
    let cumulativeWords = /*[[${cumulativeWords}]]*/ 0;  // 전체 누적 단어 수
    let knownWordsCount = /*[[${knownWordsCount} ?: 0]]*/ 0;  // 안다 개수 초기값
    // let knownWordsCount = /*[[${knownWordsCount} ?: 0]]*/[]; // 안다로 체크한 단어 수

    window.onload = () => {
      updateProgress();  // 초기값 세팅
      showWord();        // 첫 단어 보여주기
    };

    function showWord() {
      if (index >= words.length) {
        reloadWords();  // 다시 모른다 리스트 가져오기
        return;
      }
      // if (words.length === 0) {
      //   alert("이 챕터를 모두 학습했습니다!");
      //   window.location.href = "/studies/levelChoice";
      //   return;
      // }

      const word = words[index];
      document.getElementById('kanji').innerText = word.kanji;
      document.getElementById('hiragana').innerText = "";
      document.getElementById('hiragana').classList.add('placeholder');
      document.getElementById('meaning').innerText = "";
      document.getElementById('meaning').classList.add('placeholder');
    }

    function toggleHiragana() {
      const elem = document.getElementById('hiragana');
      if (elem.innerText === "") {
        elem.innerText = words[index].hiragana;
        elem.classList.remove('placeholder');
      } else {
        elem.innerText = "";
        elem.classList.add('placeholder');
      }
    }

    function toggleMeaning() {
      const elem = document.getElementById('meaning');
      if (elem.innerText === "") {
        elem.innerText = words[index].meaning;
        elem.classList.remove('placeholder');
      } else {
        elem.innerText = "";
        elem.classList.add('placeholder');
      }
    }

    function know() {
      updateProgressRequest("안다");
      knownWordsCount++;
    }

    function dontKnow() {
      updateProgressRequest("모른다");
    }

    function updateProgressRequest(status) {
      fetch('/studies/wordProgress', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          wordId: words[index].wordId,
          status: status,
          chapterId: chapterId,
          cumulativeWords : cumulativeWords // 여기에 전체 단어 갯수 넣으면 돌거 같은데?!
        })
      }).then(response => response.json()) // ✅ 서버에서 최신 knownWordsCount 반환 받음!
        .then(data => {
          knownWordsCount = data;
          
          // 먼저 진행률 화면 업데이트
          updateProgress();
          
          // 모든 단어를 학습했는지 확인
          if (knownWordsCount === cumulativeWords) {
            // 약간의 지연을 주어 사용자가 진행률 업데이트를 볼 수 있게 함
            setTimeout(() => {
              const isReset = confirm("🎉 챕터의 모든 단어를 학습했습니다! 다시 학습하시겠습니까?");
              
              if (isReset) {
                // 사용자가 확인을 누르면 리셋 API 호출
                fetch(`/studies/resetChapter?chapterId=${chapterId}`, {
                  method: 'POST'
                }).then(() => {
                  alert("챕터가 리셋되었습니다. 다시 학습합니다.");
                  window.location.reload();// 페이지 새로고침
                  reloadWords(); // 단어 다시 로드
                });
              } else {
                // 사용자가 취소를 누르면 레벨 선택 페이지로 이동
                alert("학습을 완료했습니다!");
                window.location.href = "/studies/levelChoice";
              }
            }, 100); // 100ms 지연으로 UI 업데이트가 보이도록 함
            return;
          }
          
          // 아직 모든 단어를 학습하지 않은 경우
          index++;
          showWord();
        });
    }

    function reloadWords() {
      fetch(`/studies/remainingWords?chapterId=${chapterId}`)
        .then(response => response.json())
        .then(data => {
          console.log("받은 데이터:", data); // 데이터 확인용 로그
          console.log("데이터 길이:", data.length); // 길이 확인용 로그
          
          words = shuffleArray(data);
          index = 0;
          totalWordsCount = cumulativeWords;
          
          updateProgress();
          
          if (words.length === 0) {
            alert("🎉 이 챕터를 모두 학습했습니다!");
            window.location.href = "/studies/levelChoice";
            // 이 부분은 필요하지 않을 수 있습니다.
            // 모든 단어를 완료하면 서버에서 이미 리셋했기 때문입니다.
            // 하지만 방어적 코딩으로 남겨둘 수 있습니다:
            //alert("모든 단어를 다시 학습합니다!");
            //window.location.reload(); // 또는 적절한 대응 로직
            return;
          /*} else {
            alert("모른다 단어를 다시 학습합니다!");
            showWord();
          }*/
          }
          
          showWord();
        });
    }
    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function stopStudy() {
      alert("그만하기를 눌렀습니다!");
      window.location.href = "/studies/levelChoice";

    }

    function updateProgress() {
      document.getElementById('progress').innerText = `${knownWordsCount} / ${cumulativeWords}`;
    }
  </script>
