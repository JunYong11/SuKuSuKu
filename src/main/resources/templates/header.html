<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>


<style>
@font-face {
	font-family: 'MOBO-Bold';
	src: url('/assets/font/MOBO-Bold.woff') format('woff');
	font-weight: normal !important;
	font-style: normal !important;
}

.custom-title {
	font-family: 'MOBO-Bold', sans-serif;
	font-size: 30px !important;
	font-weight: normal !important;
	letter-spacing: 5px !important;
	line-height: 1.2 !important;
	padding-top: 25px !important;
	margin-bottom: 30px !important;
	white-space: nowrap !important;
	overflow: hidden !important;
	letter-spacing: 0px !important; /* 0~1px 권장 */
}

.custom-title {
	color: #5558e8 !important;
}
</style>
<body class="toggle-sidebar">
	<!-- ======= Header ======= -->
	<header id="header" class="header fixed-top d-flex align-items-center">


		<div class="d-flex align-items-center justify-content-between"
			style="width: 200px;">
			<a href="/" class="logo d-flex align-items-center"> <img
				src="/assets/img/logo.png" alt="">
				<div class="custom-title">sukusuku</div>
			</a>
		</div>
		<th:block
							th:if="${session.loginUser != null}">
		<i class="bi bi-list toggle-sidebar-btn"></i>
		</th:block>
		<!-- End Logo -->

		<nav class="header-nav ms-auto">
			<ul class="d-flex align-items-center">
				<li class="nav-item dropdown pe-3"><a
					class="nav-link nav-profile d-flex align-items-center pe-0"
					href="#" data-bs-toggle="dropdown"> <th:block
							th:if="${session.loginUser != null}">
							<img id="header-profile"
								th:src="@{'/assets/img/profile/' + ${session.loginUser.profileImage}}"
								alt="Profile" class="rounded-circle" width="40" height="40">

							<span onclick="location.href='/mypage';"
								th:text="${session.loginUser.username}"
								style="font-weight: bold; font-size: 18px; margin-left: 10px;">
								아이디 </span>
						</th:block> <th:block th:unless="${session.loginUser != null}">
							<span onclick="location.href='/';"
								style="font-weight: bold; font-size: 18px; margin-left: 10px; color: gray;">
								로그인 </span>
						</th:block>
				</a></li>
				<!-- End Profile Nav -->
			</ul>
		</nav>
		<!-- End Icons Navigation -->
		
<script>
window.addEventListener("DOMContentLoaded", function () {
    fetch('/mypage/api/getProfileImage')
        .then(response => response.json())
        .then(data => {
            if (data.profileImage) {
                document.getElementById("header-profile").src = "/assets/img/profile/" + data.profileImage;
            }
        })
        .catch(error => console.error("프로필 이미지 불러오기 실패:", error));
});
</script>


	</header>
	<!— End Header —>

</body>
</html>
