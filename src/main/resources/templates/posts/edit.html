<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정하기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h2>글 수정하기</h2>

    <form action="/posts/{postId}/edit" method="post">
        <input type="hidden" name="_method" value="put">

        <input type="hidden" name="postId" th:value="${post.id}">

        <label>카테고리:
            <select name="category">
                <option value="자유" th:selected="${post.category.name() == '자유'}">자유게시판</option>
                <option value="질문" th:selected="${post.category.name() == '질문'}">질문게시판</option>
                <option value="자료" th:selected="${post.category.name() == '자료'}">자료게시판</option>
            </select>
        </label>
        <br><br>

        <label>제목:
            <input type="text" name="title" th:value="${post.title}">
        </label>
        <br><br>

        <label>내용:
            <textarea name="content" rows="10" cols="50" th:text="${post.content}"></textarea>
        </label>
        <br><br>

        <label>비밀글:
            <input type="checkbox" name="secret" th:checked="${post.secret}">
        </label>
        <br><br>

        <button type="submit" class="btn btn-primary">수정 완료</button>
    </form>
</div>

</body>
</html>
