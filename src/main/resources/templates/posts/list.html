<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${categoryName} + ' 게시판'">게시판</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 15px 20px;
            text-align: center;
        }

        main {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        select {
            padding: 8px 12px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table th, table td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #f1f1f1;
            color: #333;
        }

        table tbody tr:hover {
            background-color: #f9f9f9;
        }

        .btn-write {
            display: inline-block;
            padding: 10px 15px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-write:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1 th:text="${categoryName} + ' 게시판'">게시판</h1>
    </header>

    <main>
        <!-- 셀렉트 박스 -->
        <div>
            <label for="category">게시판 선택: </label>
            <select id="category" onchange="location.href='/posts/list?category=' + this.value">
                <option value="FREE" th:selected="${category} == 'FREE'">자유 게시판</option>
                <option value="QUESTION" th:selected="${category} == 'QUESTION'">질문 게시판</option>
                <option value="DATA" th:selected="${category} == 'DATA'">자료 게시판</option>
            </select>
        </div>

        <!-- 게시글 리스트 -->
        <table>
            <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>작성일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="post : ${posts}">
                    <td th:text="${post.id}">1</td>
                    <td>
                        <a th:href="@{'/posts/view/' + ${post.id}}" th:text="${post.title}">게시글 제목</a>
                    </td>
                    <td th:text="${post.author}">작성자</td>
                    <td th:text="${#dates.format(post.createdAt, 'yyyy-MM-dd')}">2025-03-20</td>
                </tr>
            </tbody>
        </table>

        <!-- 글쓰기 버튼 -->
        <a href="/posts/create" class="btn-write">글쓰기</a>

    </main>

</body>
</html>
