<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 전체보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- 네비게이션 바 -->
<div th:replace="~{navi :: navi}"></div>

<div class="container my-5">
    <h2>게시글 전체보기</h2>

    <!-- ✅ 글 작성 버튼 -->
    <div class="d-flex justify-content-end mb-3">
        <a href="/posts/create" class="btn btn-primary">글 작성하기</a>
    </div>

    <!-- ✅ 정렬 옵션 -->
    <form method="get" th:action="@{/posts/list}" class="mb-3">
        <input type="hidden" name="category" th:value="${param.category}">
        <input type="hidden" name="keyword" th:value="${param.keyword}">

        <div class="d-flex align-items-center">
            <label class="me-2">정렬:</label>
            <select name="sort" class="form-select w-auto" onchange="this.form.submit()">
                <option value="recent" th:selected="${param.sort == 'recent'}">최신순</option>
                <option value="old" th:selected="${param.sort == 'old'}">오래된순</option>
                <option value="popular" th:selected="${param.sort == 'popular'}">조회순</option>
            </select>
        </div>
    </form>

    <!-- ✅ 게시글 목록 테이블 -->
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th scope="col">#</th>
            <th scope="col">제목</th>
            <th scope="col">작성자</th>
            <th scope="col">조회수</th>
            <th scope="col">등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post, postStat : ${posts}">
            <td th:text="${postStat.index + 1}">1</td>
            <td>
                <a th:href="@{/posts/view/{id}(id=${post.id})}" th:text="${post.title}">제목</a>
            </td>
            <td th:text="${post.author}">작성자</td>
            <td th:text="${post.views}">조회수</td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">등록일</td>
        </tr>
        </tbody>
    </table>

    <!-- ✅ 페이징 처리 -->
    <nav>
        <ul class="pagination justify-content-center">
            <!-- 이전 페이지 -->
            <li class="page-item" th:classappend="${posts.first} ? 'disabled'">
                <a class="page-link" th:href="@{/posts/list(page=${posts.number - 1}, size=${posts.size}, sort=${param.sort}, category=${param.category}, keyword=${param.keyword})}">이전</a>
            </li>

            <!-- 페이지 번호 반복 -->
            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, posts.totalPages - 1)}"
                th:classappend="${pageNum == posts.number} ? 'active'">
                <a class="page-link" th:href="@{/posts/list(page=${pageNum}, size=${posts.size}, sort=${param.sort}, category=${param.category}, keyword=${param.keyword})}"
                   th:text="${pageNum + 1}"></a>
            </li>

            <!-- 다음 페이지 -->
            <li class="page-item" th:classappend="${posts.last} ? 'disabled'">
                <a class="page-link" th:href="@{/posts/list(page=${posts.number + 1}, size=${posts.size}, sort=${param.sort}, category=${param.category}, keyword=${param.keyword})}">다음</a>
            </li>
        </ul>
    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
