<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title th:text="${categoryName}">게시판</title>

    <!-- 공통 CSS -->
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">

    <style>
        .main {
            margin-left: 250px;
            padding: 20px;
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .pagetitle {
            margin-bottom: 20px;
        }

        .section {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .table th {
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>

<!-- Header -->
<div th:replace="~{header.html}"></div>
<!-- Sidebar -->
<div th:replace="~{sidebar.html}"></div>

<!-- Main Content -->
<main id="main" class="main">


    <section class="section">
        <div class="actions mb-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-4">
                <div class="d-flex align-items-center">
                    <select id="category" class="form-select form-select-sm" onchange="moveToCategory()">
                        <option value="FREE" th:selected="${category.toString()} == 'FREE'">자유게시판</option>
                        <option value="QUESTION" th:selected="${category.toString()} == 'QUESTION'">질문게시판</option>
                        <option value="DATA" th:selected="${category.toString()} == 'DATA'">자료게시판</option>
                    </select>
                </div>
                <div class="d-flex align-items-center">
                    <select id="sort" class="form-select form-select-sm" onchange="changeSort()">
                        <option value="recent" th:selected="${sort == 'recent'}">최신순</option>
                        <option value="oldest" th:selected="${sort == 'oldest'}">오래된순</option>
                        <option value="views" th:selected="${sort == 'views'}">조회수순</option>
                    </select>
                </div>
                <form method="get" th:action="@{/posts/list}" class="d-flex align-items-center gap-2">
    <select name="searchType" class="form-select form-select-sm" style="width: 120px;">
        <option value="title" th:selected="${searchType == 'title'}">제목</option>
        <option value="content" th:selected="${searchType == 'content'}">내용</option>
        <option value="author" th:selected="${searchType == 'author'}">작성자</option>
    </select>
    
    <input type="text" name="keyword" class="form-control form-control-sm" placeholder="검색어 입력" th:value="${keyword}">
    
<button type="submit" class="btn btn-primary btn-sm" style="width: 60px; height: 38px; font-size: 14px; white-space: nowrap;">검색</button>


</form>
                
            </div>
            <a th:href="@{/posts/create}" class="btn btn-primary">글쓰기</a>
        </div>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>조회수</th>
                    <th>작성일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="post : ${posts}">
					 <td th:text="${posts.totalElements - ((posts.number * posts.size) + postStat.index)}"></td>
                    <td>
                        <a href="javascript:void(0);"
                           th:if="${post.secret}"
                           th:attr="data-id=${post.id}"
                           onclick="openPasswordModal(this)">
                            <span class="text-danger">🔒</span>
                            <span th:text="${post.title}"></span>
                        </a>
                        <a th:if="${!post.secret}"
                           th:href="@{/posts/view/{id}(id=${post.id})}"
                           th:text="${post.title}">제목</a>
                    </td>
                    <td th:text="${post.author}"></td>
                    <td th:text="${post.views}"></td>
                    <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></td>
                </tr>
            </tbody>
        </table>

        <div class="pagination mt-3" th:if="${navi.totalPageCount > 0}">
            <a th:href="@{/posts/list(category=${category}, page=${navi.startPageGroup - 1}, sort=${sort})}"
               th:if="${navi.startPageGroup > 0}"
               class="btn btn-outline-secondary btn-sm">이전</a>

            <span th:each="i : ${#numbers.sequence(navi.startPageGroup, navi.endPageGroup)}">
                <a th:href="@{/posts/list(category=${category}, page=${i}, sort=${sort})}"
                   th:text="${i + 1}"
                   th:classappend="${i == navi.currentPage} ? 'btn btn-primary btn-sm ms-1' : 'btn btn-outline-secondary btn-sm ms-1'">
                </a>
            </span>

            <a th:href="@{/posts/list(category=${category}, page=${navi.endPageGroup + 1}, sort=${sort})}"
               th:if="${navi.endPageGroup < navi.totalPageCount - 1}"
               class="btn btn-outline-secondary btn-sm">다음</a>
        </div>
    </section>
    
</main>

<!-- 비밀번호 입력 모달 -->
<div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="passwordForm" method="post">
        <div class="modal-header">
          <h5 class="modal-title">비밀글 비밀번호 입력</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>
        <div class="modal-body">
          <input type="password" name="inputPassword" class="form-control" placeholder="비밀번호 입력" required>
          <div class="text-danger mt-2 d-none" id="passwordError">비밀번호가 틀렸습니다.</div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">확인</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Footer -->
<div th:replace="~{footer.html}"></div>

<!-- Vendor JS -->
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/main.js"></script>

<script>
function moveToCategory() {
    const category = document.getElementById('category').value;
    const sort = document.getElementById('sort').value;
    window.location.href = `/posts/list?category=${category}&sort=${sort}`;
}

function changeSort() {
    const sort = document.getElementById('sort').value;
    const category = document.getElementById('category').value;
    window.location.href = `/posts/list?category=${category}&sort=${sort}`;
}

let selectedPostId = null;

function openPasswordModal(link) {
    selectedPostId = link.getAttribute("data-id");
    const modal = new bootstrap.Modal(document.getElementById('passwordModal'));
    document.getElementById("passwordError").classList.add("d-none");
    document.querySelector("#passwordForm input[name='inputPassword']").value = "";
    modal.show();
}

document.getElementById("passwordForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const password = this.inputPassword.value;

    fetch(`/posts/${selectedPostId}/check-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ inputPassword: password })
    }).then(res => {
        if (res.redirected) {
            window.location.href = res.url;
        } else {
            document.getElementById("passwordError").classList.remove("d-none");
        }
    }).catch(err => {
        console.error(err);
    });
});
</script>

</body>
</html>
