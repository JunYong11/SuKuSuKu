<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${post.title}">게시글 상세보기</title>

  <!-- CSS -->
  <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">

  <style>
    .comment-card { margin-bottom: 15px; }
    .reply-card { margin-left: 30px; }
    .btn-sm { padding: 0.25rem 0.5rem; }
  </style>
</head>

<body>

<!-- ✅ Header -->
<div th:replace="~{header.html}"></div>

<!-- ✅ Sidebar -->
<div th:replace="~{sidebar.html}"></div>

<!-- ✅ Main content -->
<main id="main" class="main">

  <!-- 게시글 상세보기 -->
  <section class="pt-3 pb-2 mb-3 border-bottom mt-5">
    <div class="card mb-4">
      <div class="card-header">
        <h3 th:text="${post.title}">게시글 제목</h3>
        <p class="mb-0">
          작성자: <span th:text="${post.author}"></span> |
          조회수: <span th:text="${post.views}"></span> |
          작성일: <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></span>
        </p>
      </div>

      <div class="card-body" style="min-height: 300px;">
        <p th:text="${post.content}">게시글 내용</p>

       <!-- ✅ 첨부 이미지 보여주기 -->
  <div th:if="${!#lists.isEmpty(post.files)}" class="mt-3">
    <div th:each="file : ${post.files}">
  <img th:if="${file.originalFileName.toLowerCase().endsWith('.png')
             or file.originalFileName.toLowerCase().endsWith('.jpg')
             or file.originalFileName.toLowerCase().endsWith('.jpeg')
             or file.originalFileName.toLowerCase().endsWith('.gif')}"
       th:src="@{/files/{fileId}(fileId=${file.id})}"
       th:alt="${file.originalFileName}"
       style="max-width: 500px; height: auto; display: block; margin-bottom: 10px;" />
</div>

        </div>
      </div>

      <div class="card-footer d-flex justify-content-end">
        <a th:href="@{/posts/{postId}/edit(postId=${post.id})}" class="btn btn-primary btn-sm">수정</a>
        <form th:action="@{/posts/delete/{postId}(postId=${post.id})}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-danger">삭제</button>
        </form>
      </div>
    </div>
  </section>

  <!-- 첨부 파일 리스트 (이미지 외 다른 파일) -->
  <section class="mb-4" th:if="${!#lists.isEmpty(post.files)}">
    <div class="card">
      <div class="card-header">
        <h5>첨부 파일</h5>
      </div>
      <div class="card-body">
        <ul class="list-group">
          <li class="list-group-item" th:each="file : ${post.files}">
            <a th:href="@{/files/download/{fileId}(fileId=${file.id})}"
               th:text="${file.originalFileName}">파일 다운로드</a>
          </li>
        </ul>
      </div>
    </div>
  </section>

  <!-- 댓글 작성 -->
  <section class="mb-4">
    <div class="card">
      <div class="card-header"><h5>댓글 작성</h5></div>
      <div class="card-body">
        <form th:action="@{/comments/create}" method="post">
          <input type="hidden" name="postId" th:value="${post.id}"/>
          <textarea name="content" class="form-control mb-2" placeholder="댓글을 입력하세요..." required></textarea>
          <button type="submit" class="btn btn-primary btn-sm">댓글 등록</button>
        </form>
      </div>
    </div>
  </section>

  <!-- 댓글 목록 -->
  <section class="mb-4">
    <div class="card">
      <div class="card-header">
        <h5 th:text="'댓글 목록 (' + ${#lists.size(comments)} + ')'">댓글 목록</h5>
      </div>
      <div class="card-body">
        <div th:each="comment : ${comments}" class="comment-card border p-3 rounded mb-3">
          <strong th:text="${comment.author}">작성자</strong>
          <p th:text="${comment.content}">댓글 내용</p>

          <div class="mb-2">
            <a th:href="@{/comments/edit/{id}(id=${comment.id})}" class="btn btn-sm btn-outline-primary">수정</a>
            <a th:href="@{/comments/delete/{id}(id=${comment.id})}" class="btn btn-sm btn-outline-danger">삭제</a>
          </div>

          <!-- 대댓글 작성 -->
          <form th:action="@{/comments/reply}" method="post" class="mb-3">
            <input type="hidden" name="parentId" th:value="${comment.id}"/>
            <input type="hidden" name="postId" th:value="${post.id}"/>
            <div class="d-flex">
              <input type="text" name="content" class="form-control form-control-sm me-2" placeholder="대댓글 입력..." required/>
              <button type="submit" class="btn btn-sm btn-secondary">대댓글 등록</button>
            </div>
          </form>

          <!-- 대댓글 리스트 -->
          <div th:each="reply : ${comment.children}" class="reply-card border p-2 bg-light rounded mb-2">
            <strong th:text="${reply.author}">작성자</strong>
            <p th:text="${reply.content}">대댓글 내용</p>

            <div class="mt-1">
              <a th:href="@{/comments/edit/{id}(id=${reply.id})}" class="btn btn-sm btn-outline-primary">수정</a>
              <a th:href="@{/comments/delete/{id}(id=${reply.id})}" class="btn btn-sm btn-outline-danger">삭제</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ✅ Footer -->
<div th:replace="~{footer.html}"></div>

<!-- ✅ 스크립트 순서 중요! -->
<script src="https://cdn.tiny.cloud/1/w46cam1ez6lhmvwwsdbw7doafu19aw217qb1hzg43gznmfbj/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
