<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />

  <title>게임선택창</title>

  <!-- 구글 폰트 & 스타일 -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans|Nunito|Poppins" rel="stylesheet">
  <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
  <link href="/assets/css/style.css" rel="stylesheet" />

<style>
  #main {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .game-select-title {
    font-size: 70px;
    font-weight: 700;
    margin-bottom: 50px;
    color: rgb(64, 0, 64);
    text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.2);
    letter-spacing: 2px;
    animation: fadeIn 1s ease-in-out;
  }

  @keyframes fadeIn {
    0% {
      opacity: 0;
      transform: translateY(-20px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .game-cards {
    display: flex;
    justify-content: center;
    gap: 50px;
  }

  .game-card {
    position: relative;
    width: 300px;
    height: 400px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .game-card:hover {
    transform: translateY(-10px);
  }

  .game-image {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    transition: filter 0.5s ease;
  }

  .game-card:hover .game-image {
    filter: brightness(0.7);
  }

  .game-overlay {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: height 0.5s ease;
    padding: 0 20px;
  }

  .game-card:hover .game-overlay {
    height: 100%;
  }

  .game-overlay h3 {
    font-size: 28px;
    margin-bottom: 10px;
  }

  .game-overlay p {
    font-size: 16px;
    margin-bottom: 20px;
    text-align: center;
  }

  .game-overlay button {
    background: #4154f1;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .game-overlay button:hover {
    background: #1a2cd8;
  }
</style>
</head>

<body>
  <div th:replace="~{header.html}"></div>
  <div th:replace="~{sidebar.html}"></div>

  <main id="main" class="main">
    <h1 class="game-select-title">일본어 학습용 게임</h1>

    <div class="game-cards">
      <!-- 게임 1 -->
      <div class="game-card">
        <div class="game-image" style="background-image: url('/assets/img/game1.jpg');"></div>
        <div class="game-overlay">
          <h3>칸지노 아메</h3>
          <p>비 내리는 일본어 단어의 뜻을 입력해 점수를 올리는 게임입니다</p>
          <button onclick="location.href='/game/rain'">게임 하러가기</button>
        </div>
      </div>

      <!-- 게임 2 -->
      <div class="game-card">
        <div class="game-image" style="background-image: url('/assets/img/game2.png');"></div>
        <div class="game-overlay">
          <h3>너의 이름은</h3>
          <p>한자를 맞춰 퍼즐을 없애가며 캐릭터를 맞추는 게임입니다</p>
          <button onclick="location.href='/game/name'">게임 하러가기</button>
        </div>
      </div>
    </div>

  </main>

  <div th:replace="~{footer.html}"></div>

  <!-- Vendor JS Files -->
  <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
  <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/vendor/chart.js/chart.umd.js"></script>
  <script src="/assets/vendor/echarts/echarts.min.js"></script>
  <script src="/assets/vendor/quill/quill.js"></script>
  <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
  <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
  <script src="/assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->
  <script src="/assets/js/main.js"></script>
</body>

</html>
