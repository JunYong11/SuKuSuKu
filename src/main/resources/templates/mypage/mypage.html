<!-- ========================================== style ============================================ -->


<style>
#calendar {
	width: 100%;
	font-size: 0.8rem;
}

.fc-daygrid-day:hover .add-event-btn {
	display: block;
}

.add-event-btn {
	display: none;
	position: absolute;
	top: 5px;
	left: 5px;
	background: #007bff;
	color: white;
	border: none;
	border-radius: 50%;
	width: 20px;
	height: 20px;
	text-align: center;
	cursor: pointer;
	font-size: 14px;
	line-height: 18px;
}

.form-control {
	margin-bottom: 10px;
}

.group-container {
	display: flex;
	align-items: center;
	flex-wrap: wrap; /* 자동 줄바꿈 */
	gap: 10px;
	margin-top: 10px;
	position: relative; /* 입력창 위치 조정을 위해 필요 */
}

.group-box {
	padding: 5px 10px;
	border-radius: 5px;
	font-size: 14px;
	display: flex;
	align-items: center;
	font-weight: bold; /* 글자 볼드 처리 */
}

/* 입력창을 + 버튼 아래에 위치 */
.popup {
	display: none;
	position: absolute;
	top: 40px; /* + 버튼 아래에 위치 */
	left: 0;
	background: white;
	padding: 10px;
	border: 1px solid #ccc;
	border-radius: 5px;
	box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
	white-space: nowrap; /* 가로 너비 유지 */
}

.container {
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 0px 20px 20px 20px;
}

.project-box {
	display: flex;
	align-items: center;
	justify-content: center;
	width: 130px;
	height: 20px;
	border-radius: 5px;
	background-color: lightblue;
	font-weight: bold;
	text-align: center;
	font-size: 15px;
	margin: 10px;
}

/* 추가 버튼 스타일 */
#confirmAddBtn {
	background-color: #007bff; /* 파란색 배경 */
	color: white; /* 흰색 글자 */
	border: none;
	padding: 5px 10px;
	border-radius: 5px;
	cursor: pointer;
	font-weight: bold; /* 글자 볼드 */
	font-size: 14px;
}

#confirmAddBtn:hover {
	background-color: #0056b3; /* 버튼에 마우스 올리면 어두운 파란색 */
}

.table-container {
	width: 100%;
	overflow-x: auto; /* 화면이 작아질 경우 가로 스크롤 */
}

table {
	width: 100%;
	border-collapse: collapse; /* 이중선 제거 */
}

th {
	border: none; /* 제목 부분 테두리 제거 */
	background-color: #f0f0f0; /* 배경색 추가 (선택 사항) */
	padding: 10px;
	text-align: center; /* 제목 가운데 정렬 */
}

td {
	border: 1px solid #000; /* 데이터 셀만 테두리 유지 */
	padding: 10px;
	text-align: center; /* 데이터도 가운데 정렬 */
}

.addGroupBtn {
	/* 배경색을 부드러운 그라디언트로 설정 */
	background: linear-gradient(135deg, #4facfe, #00f2fe);
	height: 40px;
	margin: 10px;
	/* 둥근 모서리 */
	border-radius: 25px;
	/* 테두리 없애기 */
	border: none;
	/* 글꼴 크기 및 색상 설정 */
	font-size: 14px;
	font-weight: bold;
	color: white;
	/* 커서를 포인터로 변경 */
	cursor: pointer;
	/* 부드러운 애니메이션 효과 */
	transition: all 0.3s ease-in-out;
	/* 그림자 추가로 버튼이 떠 있는 느낌 */
	box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
}

/* 마우스를 올렸을 때 효과 */
.addGroupBtn:hover {
	/* 색을 좀 더 밝게 변경 */
	background: linear-gradient(135deg, #3b82f6, #06b6d4);
	/* 그림자를 더 강하게 */
	box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
}

/* 버튼 클릭 시 효과 */
.addGroupBtn:active {
	/* 약간 작아지는 효과 */
	transform: scale(0.95);
}
/* 카드 기본 스타일 */
.project-card {
	position: relative; /* 삭제 버튼 위치를 절대값으로 배치하기 위해 설정 */
	background: #f0f0f0;
	border-radius: 5px;
	transition: background 0.3s ease-in-out;
}

/* 마우스 오버 시 배경색 변경 */
.project-card:hover {
	background: #e0e0e0;
}

/* 삭제 버튼 스타일 */
.delete-btn {
	position: absolute;
	left: 10px; /* 오른쪽 끝으로 이동 */
	top: 10px; /* 위쪽 끝으로 이동 */
	background: transparent;
	border: none;
	font-size: 14px;
	color: red;
	cursor: pointer;
	opacity: 0; /* 기본 상태에서는 숨김 */
	transition: opacity 0.3s ease-in-out;
	top: 10px;
}

/* 마우스를 올렸을 때만 삭제 버튼 보이게 */
.project-card:hover .delete-btn {
	opacity: 1;
}

.schedule-container {
	position: relative; /* 삭제 버튼을 상대적으로 배치하기 위해 설정 */
}

.delete-events-btn {
	display: none; /* 기본적으로 버튼 숨기기 */
	position: absolute;
	left: 0; /* td의 오른쪽 끝에 위치 */
	top: 50%;
	transform: translateY(-50%); /* 세로 중앙에 배치 */
	background-color: transparent;
	border: none;
	font-size: 18px;
	color: red;
	cursor: pointer;
	transition: opacity 0.3s ease;
}

.schedule-container:hover .delete-events-btn {
	display: block; /* 커서가 할일에 올라가면 삭제 버튼 보이기 */
	opacity: 1;
}

.achievement-container {
	display: flex;
	align-items: center;
	gap: 10px;
	margin-top: 20px;
}

.achievement-bar {
	position: relative;
	width: 200px;
	height: 10px;
	background-color: #f3f3f3;
	border-radius: 10px;
	box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
}

.achievement-fill {
	height: 100%;
	background-color: #87CEEB; /* 초록색 (완료된 비율 표시) */
	border-radius: 10px;
	transition: width 0.3s ease; /* 변화 애니메이션 */
}

.achievement-percentage {
	font-size: 14px;
	font-weight: bold;
	color: #333;
}
</style>

</head>

							</h5>

				<!-- 추가 위젯 (오른쪽) -->
				<div class="col-xl-8">

	<!-- ========================================== script ============================================ -->

	<script>
	document.querySelectorAll('.completion-checkbox').forEach(checkbox => {
	    checkbox.addEventListener('change', function() {
	        let calendarId = this.getAttribute('data-calendar-id'); // 일정 ID 가져오기
	        let isChecked = this.checked; // 체크 여부 확인 (true / false)
	        let username = this.getAttribute('data-username'); // 사용자 이름 가져오기


	        // 서버로 체크 상태 업데이트 요청
	        fetch('/mypage/api/updateCompletionStatus', {
	            method: 'POST',
	            headers: {
	                'Content-Type': 'application/json'
	            },
	            body: JSON.stringify({
	                calendarId: calendarId,
	                completed: isChecked
	            })
	        })
	        .then(response => response.json())
	        .then(data => {
	            if (data.success) {
	                console.log(`스케줄 ID ${calendarId}의 완료 상태가 ${isChecked}로 변경됨`);
	                
	                console.log(username);
	                
	                updateUserAchievement(username)
	                
	            } else {
	                console.error('업데이트 실패:', data.message);
	            }
	        })
	        .catch(error => {
	            console.error('오류 발생:', error);
	        });
	        
	       
	    });
	});
	
	// ✅ 사용자별 프로젝트 달성률 업데이트 요청 함수
	function updateUserAchievement(username) {
    fetch('/mypage/api/updateUserAchievement', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username: username })
    })
    .then(response => response.json())
    .then(data => {
        console.log("백엔드 응답:", data);

        if (data.userAchievements) {
            console.log("달성률 업데이트 완료:", data.userAchievements);

            // 각 프로젝트 ID별로 달성률 업데이트
            data.userAchievements.forEach(project => {
                let achievementElement = document.querySelector(`#project-achievement-${project.projectId}`);
                let achievementBar = achievementElement?.parentElement?.querySelector(".achievement-fill");

                if (achievementElement && achievementBar) {
                    console.log(`업데이트 대상: ${project.projectId}, 달성률: ${project.achievementRate}`);

                    // 1️⃣ 퍼센트 텍스트 업데이트
                    achievementElement.textContent = `${project.achievementRate.toFixed(1)}%`;

                    // 2️⃣ 막대 너비 업데이트
                    achievementBar.style.width = `${project.achievementRate}%`;
                } else {
                    console.warn(`해당 ID를 가진 요소를 찾을 수 없음: #project-achievement-${project.projectId}`);
                }
            });
        } else {
            console.error('프로젝트 달성률 업데이트 실패:', data.message);
        }
    })
    .catch(error => {
        console.error('오류 발생:', error);
    });
}
	</script>


	<script>
	let calendar;  // 전역 변수로 선언
	
	document.addEventListener('DOMContentLoaded', function () {
		
	    var calendarEl = document.getElementById('calendar');
	    
	    let username = document.querySelector('.completion-checkbox')?.getAttribute('data-username');
	    if (username) {
	        updateUserAchievement(username); // ✅ 마이페이지 로드 시에도 달성률 업데이트
	    }
	    
	   	calendar = new FullCalendar.Calendar(calendarEl, {
	        expandRows: true,
	        initialView: 'dayGridMonth',
	        locale: 'ko',
	        selectable: true,
	        dayMaxEvents: true,
	        

	        // 서버에서 일정 데이터 가져오기
	        events: "/mypage/events", // 백엔드 API 호출


	        dateClick: function (info) {
	            document.getElementById('selectedDate').innerText = info.dateStr;
	            document.getElementById('selectedDateInput').value = info.dateStr;
	            let eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
	            eventModal.show();
	        },
	        dayCellDidMount: function (info) {
	            let btn = document.createElement('button');
	            btn.textContent = '+';
	            btn.classList.add('add-event-btn');
	            btn.onclick = function (event) {
	                event.stopPropagation();
	                document.getElementById('selectedDate').innerText = info.dateStr;
	                document.getElementById('selectedDateInput').value = info.dateStr;
	                let eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
	                eventModal.show();
	            };
	            info.el.style.position = 'relative';
	            info.el.appendChild(btn);
	        }
	    });

	    calendar.render();

	    // 사이드바 토글 이벤트 감지 후 캘린더 리렌더링
	    function resizeCalendar() {
	        setTimeout(() => {
	            calendar.updateSize();

	<script>

const addGroupBtn = document.getElementById("addGroupBtn");
const popup = document.getElementById("popup");
const groupInput = document.getElementById("groupInput");
const groupContainer = document.getElementById("groupContainer");

// 더 예쁜 색상 배열로 변경
const colors = [
  "#FFB6C1", // 연한 핑크
  "#FFD700", // 금색
  "#32CD32", // 라임 그린
  "#00BFFF", // 딥 스카이 블루
  "#FF6347", // 토마토
  "#8A2BE2"  // 블루 바이올렛
];
let colorIndex = 0;

// + 버튼 클릭 시 입력창 표시 (위치 동기화)
addGroupBtn.addEventListener("click", (event) => {
  popup.style.display = "block";
  updatePopupPosition();
  event.stopPropagation(); // 이 클릭 이벤트가 부모로 전파되지 않도록 막기
});


// 입력창 위치 업데이트 함수
function updatePopupPosition() {
  popup.style.left = `${addGroupBtn.offsetLeft}px`; // + 버튼 위치에 맞춰 이동
}

//바깥 영역 클릭 시 팝업 닫기
window.addEventListener("click", (event) => {
  // 팝업과 + 버튼 외부를 클릭했을 경우에만 팝업을 숨김
  if (!groupContainer.contains(event.target)) {
    popup.style.display = "none";
  }
});

// 팝업 내부 클릭 시 이벤트 전파를 막아서 팝업이 사라지지 않도록 함
popup.addEventListener("click", (event) => {
  event.stopPropagation(); // 팝업 클릭 이벤트가 바깥으로 전파되지 않도록 막음
})

    window.onload = function() {
        const projectBoxes = document.querySelectorAll(".project-box");

        projectBoxes.forEach((box, index) => {
            // 색상을 순환적으로 적용 (색상 개수보다 프로젝트가 많을 경우 반복됨)
            box.style.backgroundColor = colors[index % colors.length];
        });
    };

	</script>
