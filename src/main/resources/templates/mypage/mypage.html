<style>
#calendar {
	width: 100%;
	font-size: 0.8rem;
}

.fc-daygrid-day:hover .add-event-btn {
	display: block;
}

.add-event-btn {
	display: none;
	position: absolute;
	top: 5px;
	left: 5px;
	background: #007bff;
	color: white;
	border: none;
	border-radius: 50%;
	width: 20px;
	height: 20px;
	text-align: center;
	cursor: pointer;
	font-size: 14px;
	line-height: 18px;
}

.form-control {
	margin-bottom: 10px;
}

.group-container {
	display: flex;
	align-items: center;
	flex-wrap: wrap; /* 자동 줄바꿈 */
	gap: 10px;
	margin-top: 10px;
	position: relative; /* 입력창 위치 조정을 위해 필요 */
}

.group-box {
	padding: 5px 10px;
	border-radius: 5px;
	font-size: 14px;
	display: flex;
	align-items: center;
	font-weight: bold; /* 글자 볼드 처리 */
}

/* 입력창을 + 버튼 아래에 위치 */
.popup {
	display: none;
	position: absolute;
	top: 40px; /* + 버튼 아래에 위치 */
	left: 0;
	background: white;
	padding: 10px;
	border: 1px solid #ccc;
	border-radius: 5px;
	box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
	white-space: nowrap; /* 가로 너비 유지 */
}

/* 추가 버튼 스타일 */
#confirmAddBtn {
	background-color: #007bff; /* 파란색 배경 */
	color: white; /* 흰색 글자 */
	border: none;
	padding: 5px 10px;
	border-radius: 5px;
	cursor: pointer;
	font-weight: bold; /* 글자 볼드 */
	font-size: 14px;
}

#confirmAddBtn:hover {
	background-color: #0056b3; /* 버튼에 마우스 올리면 어두운 파란색 */
}
</style>

<body>

	<!-- ========================= 수정 시작 =================================-->

		<div class="pagetitle">

			</nav>
		</div>
		<!-- End Page Title -->

		<section class="section profile" th:object="${loginUser}">
			<div class="row">
				<div class="col-xl-3">
					<div class="card">
						<div
							class="card-body profile-card pt-4 d-flex flex-column align-items-center">

							<h2 th:text="*{username}">아이디</h2>
							<h3	th:text="*{level}">급수</h3>
							<div class="social-links mt-2">
								<a href="#" class="twitter"><i class="bi bi-twitter"></i></a> <a
									href="#" class="facebook"><i class="bi bi-facebook"></i></a> <a
									href="#" class="instagram"><i class="bi bi-instagram"></i></a>
								<a href="#" class="linkedin"><i class="bi bi-linkedin"></i></a>
							</div>
						</div>
					</div>
				</div>

				<!-- 추가 위젯 (오른쪽) -->
				<div class="col-xl-8">
					<div class="card">
						<div class="card-body">
							<h5 class="card-title" style="font-size: 20px; margin: 0;">Project</h5>
							<div style="border-bottom: 1px solid black; width: 100%;"></div>

							<!-- 그룹 추가되는 부분 -->
							<div class="group-container" id="groupContainer">
								<button id="addGroupBtn" style="border: none; background: none; font-size: 22px; cursor: pointer;">+</button>
							</div>

							<!-- 입력창 (초기에는 숨김) -->
							<form action="api/project" method="post" enctype="multipart/form-data">
								<div id="popup" class="popup">
									<input type="text" id="groupInput" name="projectName" placeholder="그룹명을 입력하세요" />
									<button id="confirmAddBtn" type="submit">추가</button>
								</div>
							</form>			
						</div>
					</div>
					<div class="card">
						<div class="card-body">
							<div id='calendar'></div>
						</div>
					</div>
				</div>



				<script>

const addGroupBtn = document.getElementById("addGroupBtn");
const popup = document.getElementById("popup");

const groupInput = document.getElementById("groupInput");
const groupContainer = document.getElementById("groupContainer");

// 더 예쁜 색상 배열로 변경
const colors = [
  "#FFB6C1", // 연한 핑크
  "#FFD700", // 금색
  "#32CD32", // 라임 그린
  "#00BFFF", // 딥 스카이 블루
  "#FF6347", // 토마토
  "#8A2BE2"  // 블루 바이올렛
];
let colorIndex = 0;

// + 버튼 클릭 시 입력창 표시 (위치 동기화)
addGroupBtn.addEventListener("click", (event) => {
  popup.style.display = "block";
  updatePopupPosition();
  event.stopPropagation(); // 이 클릭 이벤트가 부모로 전파되지 않도록 막기
});


// 입력창 위치 업데이트 함수
function updatePopupPosition() {
  popup.style.left = `${addGroupBtn.offsetLeft}px`; // + 버튼 위치에 맞춰 이동
}

//바깥 영역 클릭 시 팝업 닫기
window.addEventListener("click", (event) => {
  // 팝업과 + 버튼 외부를 클릭했을 경우에만 팝업을 숨김
  if (!groupContainer.contains(event.target)) {
    popup.style.display = "none";
  }
});

// 팝업 내부 클릭 시 이벤트 전파를 막아서 팝업이 사라지지 않도록 함
popup.addEventListener("click", (event) => {
  event.stopPropagation(); // 팝업 클릭 이벤트가 바깥으로 전파되지 않도록 막음
});

</script>

	<!-- ========================================== modal ============================================ -->

	<!-- 일정 입력 모달 -->

		aria-labelledby="eventModalLabel" aria-hidden="true">

			<div class="modal-content">

					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<p>
						<strong>선택한 날짜:</strong> <span id="selectedDate"></span>
					</p>

						type="hidden" id="selectedDateInput"> <input type="text"
						id="schedule" class="form-control"> <input type="hidden"
						id="selectedDateInput"> <input type="text" id="schedule"
						class="form-control" placeholder="일정"> <input type="text"
						id="memo" class="form-control" placeholder="메모">
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">닫기</button>
					<button type="button" class="btn btn-primary" id="saveEvent">저장</button>
				</div>
			</div>
		</div>
	</div>

	<!--  script -->


	<script>
	document.addEventListener('DOMContentLoaded', function () {
	    var calendarEl = document.getElementById('calendar');
	    var calendar = new FullCalendar.Calendar(calendarEl, {
	        expandRows: true,
	        initialView: 'dayGridMonth',
	        locale: 'ko',
	        selectable: true,
	        dayMaxEvents: true,
	        dateClick: function (info) {
	            document.getElementById('selectedDate').innerText = info.dateStr;
	            document.getElementById('selectedDateInput').value = info.dateStr;
	            let eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
	            eventModal.show();
	        },
	        dayCellDidMount: function (info) {
	            let btn = document.createElement('button');
	            btn.textContent = '+';
	            btn.classList.add('add-event-btn');
	            btn.onclick = function (event) {
	                event.stopPropagation();
	                document.getElementById('selectedDate').innerText = info.dateStr;
	                document.getElementById('selectedDateInput').value = info.dateStr;
	                let eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
	                eventModal.show();
	            };
	            info.el.style.position = 'relative';
	            info.el.appendChild(btn);
	        }
	    });

	    calendar.render();

	    // 사이드바 토글 이벤트 감지 후 캘린더 리렌더링
	    function resizeCalendar() {
	        setTimeout(() => {
	            calendar.updateSize();
	        }, 300); // 애니메이션이 끝날 시간 고려해서 약간의 딜레이
	    }

	    // 사이드바 버튼 클릭 감지 (부트스트랩 기반)
	    document.querySelector('.toggle-sidebar-btn').addEventListener('click', resizeCalendar);
	});


    </script>

	<script>
	document.getElementById('saveEvent').addEventListener('click', function() {
	    let formData = {
	        selectDate: document.getElementById('selectedDateInput').value,
	        schedule: document.getElementById('schedule').value,
	        memo: document.getElementById('memo').value
	    };

	    fetch('/users/register', {
	        method: 'POST',
	        headers: {
	            'Content-Type': 'application/json'
	        },
	        body: JSON.stringify(formData)
	    })
    	.then(response => response.text()) // 문자열 응답 처리
    	.then(data => {
        	console.log('Success:', data);

	        // 모달창 닫기
	        let eventModal = bootstrap.Modal.getInstance(document.getElementById('eventModal'));
	        eventModal.hide();

	        // 캘린더 새로고침
	        calendar.refetchEvents();
	    })
	    .catch(error => {
	        console.error('Error:', error);
	    });
	});

	
	</script>
