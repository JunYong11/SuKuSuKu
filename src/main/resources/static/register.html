<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">회원가입</h2>

    <!-- ✅ action 수정: /users/register -->
    <form action="/users/register" method="post" class="col-6 mx-auto">

        <!-- 아이디 -->
        <div class="mb-3">
            <label for="username" class="form-label">아이디 (4~12자)</label>
            <input type="text" class="form-control" id="username" name="username" minlength="4" maxlength="12" required>
            <button type="button" class="btn btn-outline-secondary mt-2">중복확인</button>
        </div>

        <!-- 비밀번호 -->
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호 (4~12자)</label>
            <input type="password" class="form-control" id="password" name="password" minlength="4" maxlength="12" required>
        </div>

        <!-- 이름 -->
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <!-- 이메일 -->
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <!-- 급수(레벨) 선택 -->
        <div class="mb-3">
            <label for="level" class="form-label">급수 선택</label>
            <select id="level" name="level" class="form-select">
                <option value="1">1급</option>
                <option value="2">2급</option>
                <option value="3">3급</option>
            </select>
        </div>

        <!-- 레벨 테스트 -->
        <button type="button" class="btn btn-info w-100 mb-2" onclick="location.href='/levelTest'">레벨 테스트</button>

        <!-- 가입 -->
        <button type="submit" class="btn btn-primary w-100">가입하기</button>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
